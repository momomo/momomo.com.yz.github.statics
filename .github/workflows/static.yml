# Deploy the spaceflow/web folder to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes to master that touch the site folder (or this workflow)
  push:
    branches: ["master"]
    paths:
      - "spaceflow/web/**"
      - ".github/workflows/static.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only upload the site folder, so its index.html becomes the root
          path: "spaceflow/web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
